# Pruebas automáticas del juego en la nube (las mismas de game/tests), para que Sasuke corrija antes y Madara revise con resultados reales.
# Primero corre las pruebas rápidas y las relacionadas con lo que cambió (respuesta en pocos minutos), después todas.
name: Pruebas Godot

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pruebas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.ref || 'main' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Traer la rama base (para saber qué cambió)
        run: git fetch -q --depth=50 origin "$BASE" || true
      - name: Caché de Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.7.2-stable-linux
      - name: Instalar Godot 4.7.2 (versión exacta, con verificación)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -sSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" | sha256sum -c -
          unzip -q godot.zip && rm godot.zip && mv Godot_v4.7.2-stable_linux.x86_64 godot && chmod +x godot
      - name: Preparar Godot
        run: sudo ln -sf ~/godot-bin/godot /usr/local/bin/godot && godot --headless --version
      - name: Caché de la importación del proyecto
        uses: actions/cache@v4
        with:
          path: game/.godot
          key: import-${{ hashFiles('game/project.godot', 'game/**/*.import') }}
          restore-keys: import-
      - name: Importar el proyecto
        run: timeout 900 godot --headless --path game --import > import.log 2>&1 || true
      - name: Correr las pruebas
        run: bash .github/scripts/pruebas_ci.sh
